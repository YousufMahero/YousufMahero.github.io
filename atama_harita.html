<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Çocuk Sağlığı ve Hastalıkları – Açık Pozisyonlar Haritası</title>
  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    /* make the map fill the page */
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // initialize the map, centered over Turkey
    var map = L.map('map').setView([39.0, 35.0], 5);

    // add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // city markers with counts
    var locations = [
      { city: 'Adıyaman',       lat: 37.7648, lon: 38.2768, count: 2 },
      { city: 'Ağrı',           lat: 39.7191, lon: 43.0518, count: 4 },
      { city: 'Aksaray',        lat: 38.3687, lon: 34.0360, count: 1 },
      { city: 'Balıkesir',      lat: 39.6484, lon: 27.8826, count: 1 },
      { city: 'Batman',         lat: 37.8870, lon: 41.1321, count: 3 },
      { city: 'Bayburt',        lat: 40.2553, lon: 40.2249, count: 1 },
      { city: 'Bilecik',        lat: 40.1500, lon: 29.9869, count: 1 },
      { city: 'Bingöl',         lat: 38.8850, lon: 40.4987, count: 2 },
      { city: 'Bitlis',         lat: 38.4000, lon: 42.1167, count: 1 },
      { city: 'Burdur',         lat: 37.7203, lon: 30.2906, count: 1 },
      { city: 'Çorum',          lat: 40.5500, lon: 34.9500, count: 3 },
      { city: 'Diyarbakır',     lat: 37.9144, lon: 40.2306, count: 1 },
      { city: 'Düzce',          lat: 40.8433, lon: 31.1565, count: 1 },
      { city: 'Edirne',         lat: 41.6772, lon: 26.5556, count: 1 },
      { city: 'Elazığ',         lat: 38.6748, lon: 39.2222, count: 1 },
      { city: 'Erzincan',       lat: 39.7480, lon: 39.4900, count: 1 },
      { city: 'Erzurum',        lat: 39.9043, lon: 41.2679, count: 4 },
      { city: 'Eskişehir',      lat: 39.7767, lon: 30.5206, count: 1 },
      { city: 'Gaziantep',      lat: 37.0594, lon: 37.3825, count: 5 },
      { city: 'Hakkari',        lat: 37.5744, lon: 43.7408, count: 2 },
      { city: 'Hatay (Antakya)',lat: 36.2028, lon: 36.1600, count: 1 },
      { city: 'Iğdır',          lat: 39.9239, lon: 44.0451, count: 3 },
      { city: 'Isparta',        lat: 37.7648, lon: 30.5566, count: 1 },
      { city: 'İstanbul',       lat: 41.0082, lon: 28.9784, count: 1 },
      { city: 'Kahramanmaraş',  lat: 37.5858, lon: 36.9371, count: 2 },
      { city: 'Kars',           lat: 40.6163, lon: 43.0959, count: 1 },
      { city: 'Kayseri',        lat: 38.7225, lon: 35.4875, count: 1 },
      { city: 'Kırklareli',     lat: 41.7358, lon: 27.2250, count: 1 },
      { city: 'Kütahya',        lat: 39.4245, lon: 29.9838, count: 3 },
      { city: 'Malatya',        lat: 38.3553, lon: 38.3095, count: 2 },
      { city: 'Mardin',         lat: 37.3120, lon: 40.7350, count: 1 },
      { city: 'Mersin',         lat: 36.8121, lon: 34.6415, count: 1 },
      { city: 'Muş',            lat: 38.7433, lon: 41.5060, count: 2 },
      { city: 'Nevşehir',       lat: 38.6247, lon: 34.7149, count: 1 },
      { city: 'Ordu',           lat: 40.9833, lon: 37.8800, count: 1 },
      { city: 'Osmaniye',       lat: 37.0740, lon: 36.2236, count: 1 },
      { city: 'Siirt',          lat: 37.9334, lon: 41.9356, count: 2 },
      { city: 'Sivas',          lat: 39.7477, lon: 37.0179, count: 1 },
      { city: 'Şanlıurfa',      lat: 37.7833, lon: 38.5167, count: 4 },
      { city: 'Şırnak',         lat: 37.5218, lon: 42.4617, count: 2 },
      { city: 'Tekirdağ',       lat: 40.9781, lon: 27.5118, count: 2 },
      { city: 'Van',            lat: 38.5012, lon: 43.4052, count: 4 },
      { city: 'Yalova',         lat: 40.6508, lon: 29.2660, count: 1 },
      { city: 'Yozgat',         lat: 39.8200, lon: 34.8042, count: 1 }
    ];

    // add a marker for each city
    locations.forEach(function(loc) {
      var marker = L.marker([loc.lat, loc.lon]).addTo(map);
      marker.bindPopup(
        '<b>' + loc.city + '</b><br/>' +
        loc.count + ' açik pozisyon'
      );
    });
  </script>
</body>
</html>
